<!doctype html>
<html lang="pt-BR" data-theme="funcional">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Painel de Stacks</title>
    <script>
      // Aplica o tema salvo antes do React montar, evitando flash do tema padrão.
      // Mantenha a chave e a lista em sincronia com src/themes/themes.ts
      // (src/themes/antiFlash.test.ts falha se divergirem).
      ;(function () {
        try {
          var temas = ['funcional', 'rpg']
          var tema = localStorage.getItem('painel-stacks:tema')
          if (temas.indexOf(tema) !== -1) {
            document.documentElement.setAttribute('data-theme', tema)
          }
        } catch (e) {
          // storage inacessível: fica o tema padrão do atributo acima
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
